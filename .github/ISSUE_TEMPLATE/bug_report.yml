name: Bug report
description: Report a reproducible problem without including private bookmark data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve BookmarkBridge. Search existing issues first and remove all private information from logs and screenshots.

  - type: input
    id: version
    attributes:
      label: BookmarkBridge version
      description: Use the version and build shown in About BookmarkBridge.
      placeholder: 0.9.0 (Build 1)
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.5
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Safari
        - Google Chrome
        - Safari and Google Chrome
        - Not browser-specific
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Do not include bookmark titles, URLs, local usernames, profile names, or absolute paths.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed bookmarks, URLs, usernames, profile names, file paths, credentials, and other private information.
          required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I did not reproduce this issue against irreplaceable bookmark data without a separate backup.
          required: true
